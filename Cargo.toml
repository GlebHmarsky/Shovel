[workspace]
members = ["rust/core", "rust/desktop", "rust/askpass"]
resolver = "3"

[workspace.package]
version = "0.49.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/GlebHmarsky/Shovel"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
thiserror = "2.0"
semver = { version = "1.0", features = ["serde"] }
tempfile = "3.23"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
