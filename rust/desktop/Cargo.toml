[package]
name = "shovel-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "Shovel"
path = "src/main.rs"

[dependencies]
shovel-core = { path = "../core" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
rfd = "0.15"
serde_json.workspace = true
sha2.workspace = true
semver = "1"
ureq = "=3.5.1"
url = "2.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
unicode-segmentation = "1"
velopack = { version = "=1.2.161", features = ["public-utils"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
chrono = "0.4"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
winresource = "=0.1.30"
