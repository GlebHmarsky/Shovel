name: Rust Windows Beta
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rust-beta-release
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Select exact master source
        run: git switch -C master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add rust-docs
          if ($LASTEXITCODE -ne 0) { throw 'Rust license documentation component is required.' }
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Use explicit runner temporary directory
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Release policy
        run: ./scripts/Test-RustReleasePolicy.ps1
      - name: Automatic-fetch regression
        run: cargo test --locked -j 1 -p shovel-core --test network automatic_fetch_updates_refs_without_touching_worktree_and_honors_cancellation -- --exact --nocapture
      - name: Lint
        run: cargo clippy --locked -j 1 --workspace --all-targets -- -D warnings
      - name: Bounded smoke suite
        run: ./scripts/Test-RustSmoke.ps1
      - name: Cache compiled dependencies
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
      - name: Build signed Rust Beta installer
        id: package
        env:
          UPDATE_KEY: ${{ secrets.RUST_UPDATE_PRIVATE_KEY }}
        run: |
          if (!$env:UPDATE_KEY) { throw 'RUST_UPDATE_PRIVATE_KEY must contain the existing update signing key.' }
          $key = Join-Path $env:RUNNER_TEMP 'shovel-update.key'
          try {
            [IO.File]::WriteAllText($key, $env:UPDATE_KEY)
            ./scripts/Build-Release.ps1 -Channel win-rust-beta -PackageOnly -PrivateKeyPath $key
            . ./scripts/Get-RustSourceFingerprint.ps1
            "version=$(Get-RustVersion $PWD)" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $key -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        id: archive
        with:
          name: Shovel-Windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Build/rust-${{ steps.package.outputs.version }}-installer-win-rust-beta/*
            Build/rust-${{ steps.package.outputs.version }}-win-x64/app/
            Build/rust-${{ steps.package.outputs.version }}-win-x64/VERIFICATION.json
            Build/rust-${{ steps.package.outputs.version }}-win-x64/verify_update_bundle.exe
            Build/rust-${{ steps.package.outputs.version }}-win-x64/cargo-metadata.json
            Build/rust-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Check version and original build archive
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          SHOVEL_VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/Get-RustWorkflowPublication.ps1 -Version $env:SHOVEL_VERSION
      - name: Restore the draft's original signed installer
        if: steps.publication.outputs.archive != ''
        id: recovery
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.publication.outputs.archive }}
          run-id: ${{ steps.publication.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shovel-original-build
          merge-multiple: true
      - name: Publish or finish the exact Rust Beta version
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHOVEL_VERSION: ${{ steps.package.outputs.version }}
          SHOVEL_ARCHIVE_ID: ${{ steps.archive.outputs.artifact-id }}
          SHOVEL_RECOVERY: ${{ steps.recovery.outputs.download-path }}
        run: |
          $version = $env:SHOVEL_VERSION
          $source = if ($env:SHOVEL_RECOVERY) { $env:SHOVEL_RECOVERY } else { "$PWD/Build" }
          ./scripts/Publish-RustRelease.ps1 -ArtifactDirectory "$source/rust-$version-installer-win-rust-beta" -PayloadDirectory "$PWD/Build/rust-$version-win-x64" -Resume -BuildArtifactId $env:SHOVEL_ARCHIVE_ID
